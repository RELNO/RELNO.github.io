<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Ariel Noyman</title>
</head>
<body>
  <h1>Page not found</h1>
  <a href="/">Return to the portfolio</a>
  <script>
    // Only forward deep bookmarks whose site's entry page specifies the matching GitHub origin.
    async function forwardLegacyBookmark() {
      const repo = location.pathname.split("/")[1];
      if (!/^[a-zA-Z0-9][a-zA-Z0-9_.-]*$/.test(repo)) return;
      const response = await fetch("/" + repo + "/index.html");
      if (!response.ok) return;
      const entry = new DOMParser().parseFromString(await response.text(), "text/html");
      const canonical = entry.querySelector('link[rel="canonical"]');
      if (canonical?.href === "https://relno.github.io/" + repo + "/") {
        location.replace("https://relno.github.io" + location.pathname + location.search + location.hash);
      }
    }
    forwardLegacyBookmark().catch(() => {});
  </script>
</body>
</html>
